name: ci

on:
  push:
    branches: [master, main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e-testnet:
    needs: unit
    runs-on: ubuntu-latest
    # Never run PR code with the payer key: pushes to the default branch and manual runs only.
    if: github.event_name != 'pull_request'
    env:
      PAYER_SECRET_KEY: ${{ secrets.PAYER_SECRET_KEY }}
      PAY_TO: ${{ vars.E2E_PAY_TO }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each run settles two $0.01 testnet payments (hono + express examples, each booting
      # its own seller against the public facilitator). The payer-sui e2e targets the public
      # demo seller, which is broken upstream (docs/spec-notes.md #12), so it is not run here.
      - name: Live testnet payment loop (skips without PAYER_SECRET_KEY)
        if: env.PAYER_SECRET_KEY != ''
        run: |
          pnpm --filter "./packages/*" build
          E2E=1 pnpm --filter example-hono-server test
          E2E=1 pnpm --filter example-express-server test
