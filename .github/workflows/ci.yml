name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e-testnet:
    needs: unit
    runs-on: ubuntu-latest
    # Secrets are unavailable to forks; the step below also skips when the secret is unset.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      PAYER_SECRET_KEY: ${{ secrets.PAYER_SECRET_KEY }}
      PAY_TO: ${{ vars.E2E_PAY_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each run settles two $0.01 testnet payments (hono + express examples, each booting
      # its own seller against the public facilitator). The payer-sui e2e targets the public
      # demo seller, which is broken upstream (docs/spec-notes.md #12), so it is not run here.
      - name: Live testnet payment loop (skips without PAYER_SECRET_KEY)
        if: env.PAYER_SECRET_KEY != ''
        run: |
          pnpm build
          E2E=1 pnpm --filter example-hono-server test
          E2E=1 pnpm --filter example-express-server test
