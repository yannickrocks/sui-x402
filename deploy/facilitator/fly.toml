# fly deploy -c deploy/facilitator/fly.toml — run from deploy/facilitator so
# the Dockerfile path resolves. Rename `app` before first launch.
app = "sui-x402-facilitator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # This config is testnet-only. A `fly deploy` from it never touches
  # mainnet until ENABLE_MAINNET and SUI_MAINNET_RPC are added out of band
  # as `fly secrets` (see docs/facilitator-runbook.md "Mainnet") — neither
  # belongs in this file.
  PORT = "4402"
  RPC_TIMEOUT_MS = "20000"
  RATE_LIMIT = "120"
  # Single endpoint = no failover. Append a comma-separated second gRPC endpoint you trust (own node or vetted provider) for production.
  SUI_TESTNET_RPC = "https://fullnode.testnet.sui.io:443"

[http_service]
  internal_port = 4402
  force_https = true
  # Settle idempotency (in-flight promise cache) and rate-limit buckets are
  # in-process. Keep exactly one always-on machine; never scale horizontally
  # without a shared store.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
